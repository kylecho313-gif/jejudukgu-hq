<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주덕구 본사 통합관리</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loginScreen" style="display:none">
  <div class="loginBox">
    <h1>제주덕구 <span>본사 통합관리</span></h1>
    <p>등록된 직원만 접속 가능합니다</p>
    <form id="loginForm">
      <input id="loginName" type="text" placeholder="이름 (예: 홍길동)" autocomplete="off" required>
      <input id="loginPw" type="password" placeholder="접속 비밀번호" autocomplete="off" required>
      <button type="submit">접속하기</button>
      <div class="loginErr" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand">제주덕구 <span>본사 통합관리</span></div>
    <div class="userInfo">
      <span id="userName"></span>
      <button class="logout" onclick="logout()">로그아웃</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="mainContent"></main>
  <footer class="foot">제주덕구 본사 운영관리 시스템 · 내부용</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
