<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제주덕구 하남본점 알바관리</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loginScreen" style="display:none">
  <div class="loginBox">
    <h1>제주덕구 <span>하남본점 알바관리</span></h1>
    <p>등록된 관리자만 접속 가능합니다</p>
    <form id="loginForm">
      <input id="loginName" type="text" placeholder="이름 (예: 홍길동)" autocomplete="off" required>
      <input id="loginPw" type="password" placeholder="접속 비밀번호" autocomplete="off" required>
      <button type="submit">접속하기</button>
      <div class="loginErr" id="loginErr"></div>
    </form>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand">제주덕구 <span>하남본점 알바관리</span></div>
    <div class="userInfo">
      <a href="attendance.html" target="_blank" rel="noopener" style="color:var(--muted)">알바 출퇴근 앱 열기</a>
      <span id="userName"></span>
      <button class="logout" onclick="logout()">로그아웃</button>
    </div>
  </header>
  <main id="mainContent"></main>
  <footer class="foot">제주덕구 하남본점 알바 출퇴근·급여정산 · 내부용</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/attendance-admin.js?v=1"></script>
</body>
</html>
